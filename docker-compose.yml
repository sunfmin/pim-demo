version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=pim
      - DB_SSLMODE=disable
      - STORAGE_DIR=/app/assets
    depends_on:
      - db
    volumes:
      - asset_data:/app/assets

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pim
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  asset_data:

